[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "treeskel"
version = "0.1.0"
description = "Estimating apple-tree branch skeletons through foliage from RGB-D images"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pillow>=10.0", "scikit-learn>=1.3", "scipy>=1.10", "scikit-image>=0.22", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pdoc>=14.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"
pythonpath = ["src"]
